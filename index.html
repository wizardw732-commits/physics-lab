<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060f;--bio:#ff2e7e;--phy:#22e6ff;--mat:#c6ff5e;--vio:#8b5cf6;--text:#eaf6ff;--dim:#7d92b3;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* intro */
#intro{justify-content:center;text-align:center;padding:20px}
.orb{position:relative;width:170px;height:170px;margin-bottom:22px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid;animation:spin 6s linear infinite}
.orb i:nth-child(1){border-color:var(--bio) transparent transparent transparent;box-shadow:0 0 22px var(--bio)}
.orb i:nth-child(2){inset:16px;border-color:transparent var(--phy) transparent transparent;box-shadow:0 0 22px var(--phy);animation-duration:4.5s;animation-direction:reverse}
.orb i:nth-child(3){inset:32px;border-color:transparent transparent var(--mat) transparent;box-shadow:0 0 22px var(--mat);animation-duration:3.2s}
.orb b{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#fff,var(--vio) 60%,transparent 72%);animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
h1{margin:0;font-size:clamp(34px,10vw,54px);font-weight:800;color:#fff;text-shadow:0 0 14px var(--phy),0 0 34px var(--vio),0 0 60px var(--bio);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 18px var(--bio),0 0 40px var(--phy),0 0 70px var(--mat)}}
.tag{margin:10px 0 26px;color:var(--dim);font-size:clamp(13px,3.6vw,16px);line-height:1.8}
.tag span:nth-child(1){color:var(--bio)}.tag span:nth-child(2){color:var(--phy)}.tag span:nth-child(3){color:var(--mat)}
.big{font-family:inherit;font-weight:800;font-size:18px;color:#04101a;border:none;padding:14px 38px;border-radius:40px;cursor:pointer;background:linear-gradient(135deg,var(--phy),var(--vio),var(--bio));background-size:200% 200%;animation:grad 4s ease infinite;box-shadow:0 0 28px rgba(139,92,246,.6)}
@keyframes grad{50%{background-position:100% 50%}}
/* menu */
#menu{justify-content:flex-start;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);overflow-y:auto}
#menu h2{margin:8px 0 2px;font-size:26px;font-weight:800;text-shadow:0 0 16px var(--phy)}
#menu p{margin:0 0 14px;color:var(--dim);font-size:13px}
.card{position:relative;width:min(100%,440px);margin:8px 0;padding:14px 16px;border-radius:22px;display:flex;align-items:center;gap:14px;cursor:pointer;overflow:hidden;background:rgba(255,255,255,.045);border:1.5px solid var(--c);animation:cg 3s ease-in-out infinite;backdrop-filter:blur(4px)}
.card::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{to{left:130%}}
@keyframes cg{50%{box-shadow:0 0 26px var(--c)}0%,100%{box-shadow:0 0 8px var(--c)}}
.card:active{transform:scale(.98)}
.card svg{width:72px;height:72px;flex:none;filter:drop-shadow(0 0 8px var(--c))}
.card h3{margin:0;font-size:21px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.card small{color:var(--dim);font-size:12.5px;line-height:1.6;display:block;margin-top:2px}
.card em{font-style:normal;font-size:12px;color:var(--c);font-weight:600}
.heart{transform-origin:12px 12px;animation:beat 1s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.sweep{transform-origin:36px 36px;animation:spin 3s linear infinite}
.tri{stroke-dasharray:200;animation:draw 3s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:200}55%,100%{stroke-dashoffset:0}}
/* voice */
.vbtn{position:fixed;top:calc(var(--sat) + 10px);left:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--phy);background:rgba(4,6,15,.7);color:#fff;font-size:19px;cursor:pointer}
/* view */
#view{background:var(--bg);justify-content:flex-start}
.bar{width:100%;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 12px 8px;border-bottom:1px solid var(--c);background:rgba(4,6,15,.95);position:relative;z-index:5}
.bar h4{margin:0;flex:1;font-size:17px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.back{font-family:inherit;font-weight:600;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--c);border-radius:20px;padding:6px 14px;cursor:pointer}
#view .vbtn{position:static;width:38px;height:38px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.askbtn{flex:none;height:38px;padding:0 14px;border-radius:20px;border:none;font-family:inherit;font-weight:800;font-size:13px;color:#04101a;background:linear-gradient(135deg,var(--phy),var(--vio));box-shadow:0 0 14px rgba(34,230,255,.55);cursor:pointer;white-space:nowrap}
.sheetWrap{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(2,3,8,.55);padding:0 10px calc(var(--sab) + 14px)}
.sheetWrap.open{display:flex}
.sheet{width:100%;max-width:420px;max-height:min(64vh,520px);overflow-y:auto;background:rgba(8,11,22,.98);border:1.5px solid var(--c);border-radius:22px;padding:12px 14px calc(var(--sab) + 12px);box-shadow:0 -6px 34px rgba(0,0,0,.55);transform:translateY(16px) scale(.98);opacity:0;transition:transform .28s ease,opacity .28s ease}
.sheetWrap.open .sheet{transform:none;opacity:1}
.sh{display:flex;align-items:center;justify-content:space-between;font-weight:800;color:var(--c)}
.sh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font-family:inherit;font-size:12.5px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:18px;padding:6px 12px;cursor:pointer}
#ans{min-height:54px;max-height:34vh;overflow-y:auto;background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.85;margin-bottom:10px;white-space:pre-wrap}
.in{display:flex;gap:8px}
.in input{flex:1;font-family:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:22px;padding:10px 14px;outline:none;min-width:0}
.in button{font-family:inherit;font-weight:800;border:none;border-radius:22px;padding:0 16px;color:#04101a;background:var(--c);cursor:pointer;font-size:15px}
#flash{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,var(--c),transparent 65%);pointer-events:none}
#flash.go{display:flex;animation:fl 1s ease forwards}
@keyframes fl{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
#flash span{font-size:60px;filter:drop-shadow(0 0 20px #fff)}
.card .ic{font-size:40px;width:72px;text-align:center;flex:none}.card h3{font-size:16px;line-height:1.5}.nb{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--c);color:#04101a;text-align:center;font-size:14px;margin-left:6px;text-shadow:none}#grid{display:flex;flex-direction:column;align-items:center;width:100%}</style>
</head>
<body>
<canvas id="bg"></canvas>

<section class="screen on" id="intro">
  <div class="orb"><i></i><i></i><i></i><b></b></div>
  <h1>مختبر الفيزياء</h1>
  <div class="tag">الفيزياء • ١٠ محاكاة وبرامج تفاعلية<br>بقوة الذكاء الاصطناعي</div>
  <button class="big" id="startBtn">ابدأ الرحلة ▶</button>
</section>

<section class="screen" id="menu"><h2>مختبر الفيزياء</h2><p>١٠ تجارب تفاعلية، ومعها مساعد ذكي يجيب أسئلتك</p><div id="grid"></div></section>

<section class="screen" id="view">
  <div class="bar"><button class="back" id="backBtn">▶ رجوع</button><h4 id="vt"></h4><button class="askbtn" id="fab">🤖 اسأل</button><button class="vbtn" id="vv2">🔊</button></div>
  <iframe id="fr" allow="autoplay"></iframe>
</section>

<div class="sheetWrap" id="sheetWrap">
<div class="sheet" id="sheet">
  <div class="sh"><span id="sht">🤖 المساعد الذكي</span><button id="shx">✕</button></div>
  <div class="chips" id="chips"></div>
  <div id="ans">اختر سؤالاً أو اكتب سؤالك...</div>
  <div class="in"><input id="q" placeholder="اكتب سؤالك هنا..." enterkeyhint="send"><button id="mic" style="display:none">🎤</button><button id="send">إرسال</button></div>
</div>
</div>
<button class="vbtn" id="vv1">🔊</button>
<div id="flash"><span id="fi"></span></div>

=\"tof\" style=\"color:var(--magenta)\">--<\/div><div class=\"lbl\">زمن الرجوع (نانوثانية)<\/div><\/div>\n<\/div>\n<div class=\"formula\">المسافة = سرعة الضوء × الزمن ÷ 2<\/div>\n<div class=\"decision\" id=\"decision\"><\/div>\n<div class=\"controls\">\n  <button id=\"modeBtn\">🎮 تحكم يدوي<\/button>\n  <button id=\"viewBtn\">🤖 شوف مثل الروبوت<\/button>\n  <button id=\"talkBtn\">🔊 اشرح<\/button>\n<\/div>\n<div class=\"hint\" id=\"speedRow\">السرعة 🐢 <input type=\"range\" id=\"spd\" min=\"0.15\" max=\"2.5\" step=\"0.05\" value=\"0.5\" style=\"vertical-align:middle;width:140px;accent-color:#22e6ff\"> 🐇<\/div>\n<p class=\"caption\" id=\"caption\"><\/p>\n<script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst W=10,dpr=Math.min(devicePixelRatio||1,2);let S=1;\nfunction resize(){const w=Math.min(innerWidth-24,460);cv.style.width=w+'px';cv.style.height=w+'px';cv.width=w*dpr;cv.height=w*dpr;S=cv.width/W;}\nresize();addEventListener('resize',resize);\nconst robot={x:5,y:5},HEAD=-Math.PI/2;\nconst objs=[{t:'c',x:7.2,y:2.6,r:.6},{t:'c',x:2.6,y:3.2,r:.5},{t:'b',x:3,y:7.4,w:1.7,h:1.1},{t:'c',x:7.5,y:7.2,r:.45}];\nfunction segs(){const s=[],m=.1,L=W-m;\n [[m,m,L,m],[L,m,L,L],[L,L,m,L],[m,L,m,m]].forEach(a=>s.push(a));\n objs.forEach(o=>{if(o.t==='b'){const x1=o.x-o.w/2,x2=o.x+o.w/2,y1=o.y-o.h/2,y2=o.y+o.h/2;\n  s.push([x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]);}});return s;}\nfunction cast(a){const dx=Math.cos(a),dy=Math.sin(a);let best=Infinity;\n objs.forEach(o=>{if(o.t!=='c')return;const fx=robot.x-o.x,fy=robot.y-o.y,b=fx*dx+fy*dy,c=fx*fx+fy*fy-o.r*o.r,d=b*b-c;\n  if(d>=0){const t=-b-Math.sqrt(d);if(t>0&&t<best)best=t;}});\n segs().forEach(([px,py,qx,qy])=>{const sx=qx-px,sy=qy-py,den=dx*sy-dy*sx;if(Math.abs(den)<1e-9)return;\n  const ox=px-robot.x,oy=py-robot.y,t=(ox*sy-oy*sx)/den,u=(ox*dy-oy*dx)/den;\n  if(t>0&&u>=0&&u<=1&&t<best)best=t;});\n return best;}\nlet pts=[],ang=0,lastD=0,robotView=false,manual=false,target=-Math.PI/2,speed=.5,hudT=0;\nconst distEl=document.getElementById('dist'),tofEl=document.getElementById('tof'),decEl=document.getElementById('decision');\nfunction norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}\nlet last=performance.now();\nfunction frame(now){\n requestAnimationFrame(frame);\n const dt=Math.min((now-last)/1000,.05);last=now;\n let step;if(manual){const da=norm(target-ang);step=Math.max(-7*dt,Math.min(7*dt,da));}else step=speed*dt;\n const n=Math.max(1,Math.ceil(Math.abs(step)/.02));\n for(let i=1;i<=n;i++){const a=ang+step*i/n,d=cast(a);pts.push({a,d,t:now});lastD=d;}\n ang+=step;\n pts=pts.filter(p=>now-p.t<1900);\n draw(now);\n // hud\n if(now-hudT>180){hudT=now;distEl.textContent=isFinite(lastD)?lastD.toFixed(1):'--';tofEl.textContent=isFinite(lastD)?(2*lastD/3e8*1e9).toFixed(1):'--';}\n let m=Infinity;pts.forEach(p=>{if(Math.abs(norm(p.a-HEAD))<.6&&p.d<m)m=p.d;});\n if(m<2){decEl.textContent='⚠️ عائق أمامي! الروبوت يقرر: انعطف';decEl.style.color='var(--magenta)';}\n else{decEl.textContent='✅ الطريق مفتوح: الروبوت يتقدم';decEl.style.color='var(--lime)';}\n}\nfunction P(x){return x*S;}\nfunction draw(now){\n ctx.clearRect(0,0,cv.width,cv.height);\n ctx.strokeStyle='rgba(34,230,255,.12)';ctx.lineWidth=1;ctx.fillStyle='rgba(125,146,179,.6)';ctx.font=(10*dpr)+'px Cairo';\n for(let r=1;r<=4;r++){ctx.beginPath();ctx.arc(P(robot.x),P(robot.y),P(r),0,7);ctx.stroke();ctx.fillText(r+'م',P(robot.x+r)+3,P(robot.y)-3);}\n if(!robotView){\n  ctx.lineWidth=2*dpr;ctx.strokeStyle='rgba(139,92,246,.7)';ctx.shadowColor='#8b5cf6';ctx.shadowBlur=8*dpr;\n  ctx.strokeRect(P(.1),P(.1),P(W-.2),P(W-.2));\n  objs.forEach(o=>{ctx.beginPath();if(o.t==='c')ctx.arc(P(o.x),P(o.y),P(o.r),0,7);else ctx.rect(P(o.x-o.w/2),P(o.y-o.h/2),P(o.w),P(o.h));\n   ctx.fillStyle='rgba(139,92,246,.12)';ctx.fill();ctx.stroke();});\n  ctx.shadowBlur=0;\n }\n // point cloud\n pts.forEach(p=>{if(!isFinite(p.d))return;const age=(performance.now()-p.t)/1900,hue=190+Math.min(p.d/8,1)*90;\n  ctx.fillStyle='hsla('+hue+',100%,65%,'+(1-age)+')';ctx.beginPath();\n  ctx.arc(P(robot.x+Math.cos(p.a)*p.d),P(robot.y+Math.sin(p.a)*p.d),(2+ (1-age)*1.5)*dpr,0,7);ctx.fill();});\n // beam\n const d=isFinite(lastD)?lastD:14,ex=P(robot.x+Math.cos(ang)*d),ey=P(robot.y+Math.sin(ang)*d);\n ctx.strokeStyle='#ff2e7e';ctx.lineWidth=2.2*dpr;ctx.shadowColor='#ff2e7e';ctx.shadowBlur=14*dpr;\n ctx.beginPath();ctx.moveTo(P(robot.x),P(robot.y));ctx.lineTo(ex,ey);ctx.stroke();\n ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,4*dpr,0,7);ctx.fill();ctx.shadowBlur=0;\n // robot\n ctx.shadowColor='#22e6ff';ctx.shadowBlur=16*dpr;ctx.fillStyle='#22e6ff';ctx.beginPath();ctx.arc(P(robot.x),P(robot.y),P(.22),0,7);ctx.fill();\n ctx.beginPath();ctx.moveTo(P(robot.x),P(robot.y-.42));ctx.lineTo(P(robot.x-.14),P(robot.y-.2));ctx.lineTo(P(robot.x+.14),P(robot.y-.2));ctx.fill();ctx.shadowBlur=0;\n}\nrequestAnimationFrame(frame);\n// drag\nlet drag=null;\nfunction pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*W};}\ncv.addEventListener('pointerdown',e=>{const p=pos(e);let best=null,bd=1.1;objs.forEach(o=>{const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;best=o;}});drag=best;if(drag||manual)cv.setPointerCapture(e.pointerId);if(!drag&&manual){aiming=true;aim(p);}});\ncv.addEventListener('pointermove',e=>{if(aiming){aim(pos(e));return;}if(!drag)return;const p=pos(e);drag.x=Math.min(8.8,Math.max(1.2,p.x));drag.y=Math.min(8.8,Math.max(1.2,p.y));});\nlet aiming=false;function aim(p){target=Math.atan2(p.y-robot.y,p.x-robot.x);}\ncv.addEventListener('pointerup',()=>{drag=null;aiming=false;});cv.addEventListener('pointercancel',()=>{drag=null;aiming=false;});\nconst modeBtn=document.getElementById('modeBtn'),speedRow=document.getElementById('speedRow');\nmodeBtn.onclick=()=>{manual=!manual;modeBtn.classList.toggle('active',manual);modeBtn.textContent=manual?'🔄 تلقائي':'🎮 تحكم يدوي';speedRow.style.display=manual?'none':'block';if(manual)target=ang;document.querySelector('.hint').textContent=manual?'المس أي مكان لتوجيه الليزر نحوه، أو اسحب العوائق':'اسحب العوائق بإصبعك وشاهد الروبوت كيف يفكر';};\ndocument.getElementById('spd').oninput=e=>speed=+e.target.value;\ndocument.getElementById('viewBtn').onclick=function(){robotView=!robotView;this.classList.toggle('active',robotView);this.textContent=robotView?'👁 أظهر الغرفة':'🤖 شوف مثل الروبوت';};\nconst text=\"الليزر شعاع ضوء دقيق. الروبوت يرسله ويقيس الزمن الذي يحتاجه ليرجع بعد أن يرتطم بجسم. وبما أن سرعة الضوء معروفة، يحسب المسافة بدقة. ومئات القياسات في الثانية ترسم للروبوت خريطة من النقاط، وبها يقرر بذكائه أين يمشي وأين يتجنب العوائق. هكذا تعمل السيارات الذاتية.\";\nconst cap=document.getElementById('caption'),talk=document.getElementById('talkBtn');\nlet voices=[];function lv(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}\nif('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}\ntalk.onclick=()=>{cap.textContent=text;if(!('speechSynthesis' in window))return;\n try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.95;const v=voices.find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;\n u.onstart=()=>talk.classList.add('active');u.onend=()=>talk.classList.remove('active');speechSynthesis.speak(u);}catch(e){}};\n<\/script>\n<\/body>\n<\/html>\n"}</script>

let cur=null,voice=true;
const WORKER_URL='https://noisy-breeze-30da.wizardw732.workers.dev';
/* voice */
let voices=[],bestVoice=null;function lv(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];pickVoice();}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function pickVoice(){const ar=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'));if(!ar.length){bestVoice=null;return;}
 const priority=[/naayf/i,/hamed/i,/majed/i,/omar/i,/youssef|yousef/i,/khalid/i,/tarek/i,/karim/i,/fahd/i];
 for(const p of priority){const v=ar.find(v=>p.test(v.name));if(v){bestVoice=v;return;}}
 const notFemale=ar.find(v=>!/female|zeina|salma|laila|hoda|amira|zariah/i.test(v.name));
 bestVoice=notFemale||ar[0];}
function say(t){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.93;u.pitch=1;if(bestVoice)u.voice=bestVoice;speechSynthesis.speak(u);}catch(e){}}
function setVoice(v){voice=v;$('vv1').textContent=$('vv2').textContent=v?'🔊':'🔇';if(!v&&window.speechSynthesis)speechSynthesis.cancel();}
$('vv1').onclick=$('vv2').onclick=()=>setVoice(!voice);

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));$('vv1').style.display=id==='view'?'none':'block';}
$('startBtn').onclick=()=>{say('أهلاً بكم في مختبر الفيزياء. اختروا التجربة التي تريدون استكشافها.');show('menu');};
Object.keys(META).forEach(k=>{const m=META[k],d=document.createElement('div');d.className='card';d.style.setProperty('--c',m.c);d.innerHTML='<div class="ic">'+m.i+'</div><div><h3>'+m.n+'</h3><small>'+m.s+'</small><em>ادخل ◀</em></div>';d.onclick=()=>enter(k);$('grid').appendChild(d)});
function enter(k){
  cur=k;const m=META[k];
  document.documentElement.style.setProperty('--c',m.c);
  $('fi').textContent=m.i;$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');

/* AI */
const sheet=$('sheet'),ans=$('ans'),qi=$('q');
$('sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet();});
function openSheet(){const m=META[cur];sheet.style.setProperty('--c',m.c);$('sht').textContent='🤖 المساعد الذكي — '+m.n;
  $('chips').innerHTML='';m.chips.forEach(([q,a])=>{const b=document.createElement('button');b.className='chip';b.textContent=q;b.onclick=()=>ask(q,a);$('chips').appendChild(b);});
  ans.textContent='اختر سؤالاً أو اكتب سؤالك...';$('sheetWrap').classList.add('open');}

let ctrl=null;
async function askWorker(q,ctxText,signal){
  const r=await fetch(WORKER_URL,{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,context:ctxText})});
  let data=null;try{data=await r.json();}catch(e){}
  if(!r.ok)throw new Error('HTTP '+r.status+' — '+(data&&data.text?data.text:'(بدون تفاصيل من السيرفر)'));
  if(!data||!data.text)throw new Error('رد فاضي من السيرفر');
  return data.text;
}
async function ask(q,fallback){
  if(!q.trim())return;ans.textContent='المساعد يفكر...';
  const m=META[cur];
  if(ctrl)ctrl.abort();ctrl=new AbortController();
  const useWorker=WORKER_URL&&!WORKER_URL.includes('YOUR-WORKER');
  if(useWorker){
    try{const text=await askWorker(q,m.ctx,ctrl.signal);ans.textContent=text;say(text);return;}
    catch(e){if(e&&e.name==='AbortError')return;
      const dbg='خطأ Worker (تشخيص مؤقت): '+(e&&e.message?e.message:String(e));
      ans.textContent=dbg;return;}
  }
  let s=null;try{if(window.claude&&claude.use)s=await claude.use('sample');}catch(e){}
  if(!s){const a=fallback||'المساعد الحي غير متاح الآن. جرّب أحد الأسئلة الجاهزة أعلاه.';ans.textContent=a;say(a);return;}
  try{
    const persona='أنت Paradox، مساعد ذكاء اصطناعي ذكي وواثق وعنده خفة دم خفيفة، تشرح داخل عرض جامعي تفاعلي لطلاب الابتدائية والمتوسطة في العراق. مباشر وما تكثر الحشو، بس ودود مع الأطفال. إذا الطالب كتب بالعامية العراقية جاوبه بالعامية العراقية البسيطة، وإذا كتب فصيح جاوبه فصيح.';
    const p=persona+'\n\nالقسم الحالي: '+m.ctx+'\nأجب بجمل قصيرة (3 إلى 5 جمل)، مع مثال واقعي، وأشر إلى علاقة الموضوع بالذكاء الاصطناعي عند المناسبة. لا تستخدم رموز تنسيق أو نجوم. إن كان السؤال بعيداً عن العلم فوجّه الطالب بلطف للقسم.\n\nسؤال الطالب: '+q;
    const r=await s([{role:'user',content:p}],{cache:false,signal:ctrl.signal,onText:({text})=>{ans.textContent=text;}});
    ans.textContent=r.text;say(r.text);
  }catch(e){if(e&&e.code==='cancelled')return;const a=fallback||'تعذر الوصول للمساعد الآن، حاول مرة ثانية.';ans.textContent=a;say(a);}
}
$('send').onclick=()=>{const q=qi.value;qi.value='';ask(q);};
qi.addEventListener('keydown',e=>{if(e.key==='Enter'){$('send').click();}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$('mic').style.display='block';$('mic').onclick=()=>{try{const r=new SR();r.lang='ar-IQ';r.onresult=e=>{const t=e.results[0][0].transcript;qi.value='';ask(t);};r.onerror=()=>{};r.start();ans.textContent='🎤 تكلّم الآن...';}catch(e){}};}
/* background */
const cv=$('bg'),ctx=cv.getContext('2d');let W,H,paused=false;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);
const cols=['#ff2e7e','#22e6ff','#c6ff5e','#8b5cf6'];
const ps=Array.from({length:55},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0004,vy:(Math.random()-.5)*.0004,c:cols[Math.floor(Math.random()*4)],r:1+Math.random()*2}));
(function loop(t){requestAnimationFrame(loop);if(paused)return;
  ctx.fillStyle='#04060f';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.35,H*.7);g.addColorStop(0,'rgba(139,92,246,.22)');g.addColorStop(1,'rgba(4,6,15,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // perspective grid
  ctx.strokeStyle='rgba(34,230,255,.16)';ctx.lineWidth=1;const hy=H*.62;
  for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(W/2+i*20,hy);ctx.lineTo(W/2+i*W*.16,H);ctx.stroke();}
  for(let j=0;j<9;j++){const y=hy+Math.pow(((j+(t/1500)%1)/9),2)*(H-hy);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // beams
  for(let b=0;b<3;b++){const a=Math.sin(t/2500+b*2)*.5+.5;ctx.strokeStyle=cols[b]+'22';ctx.lineWidth=40;ctx.beginPath();ctx.moveTo(W*(.2+b*.3),0);ctx.lineTo(W*(.5+Math.sin(t/3000+b)*.3),H);ctx.globalAlpha=a*.5;ctx.stroke();ctx.globalAlpha=1;}
  ps.forEach(p=>{p.x=(p.x+p.vx*16+1)%1;p.y=(p.y+p.vy*16+1)%1;ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r,0,7);ctx.fill();});ctx.shadowBlur=0;
});
