<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07245a;--bio:#ff2e7e;--phy:#22e6ff;--mat:#c6ff5e;--vio:#8b5cf6;--text:#eaf6ff;--dim:#7d92b3;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:fadein .7s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
/* intro */
#intro{justify-content:center;text-align:center;padding:20px}
.orb{position:relative;width:170px;height:170px;margin-bottom:22px}
.orb i{position:absolute;inset:0;border-radius:50%;border:2px solid;animation:spin 6s linear infinite}
.orb i:nth-child(1){border-color:var(--bio) transparent transparent transparent;box-shadow:0 0 22px var(--bio)}
.orb i:nth-child(2){inset:16px;border-color:transparent var(--phy) transparent transparent;box-shadow:0 0 22px var(--phy);animation-duration:4.5s;animation-direction:reverse}
.orb i:nth-child(3){inset:32px;border-color:transparent transparent var(--mat) transparent;box-shadow:0 0 22px var(--mat);animation-duration:3.2s}
.orb b{position:absolute;inset:58px;border-radius:50%;background:radial-gradient(circle,#fff,var(--vio) 60%,transparent 72%);animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
h1{margin:0;font-size:clamp(34px,10vw,54px);font-weight:800;color:#fff;text-shadow:0 0 14px var(--phy),0 0 34px var(--vio),0 0 60px var(--bio);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 18px var(--bio),0 0 40px var(--phy),0 0 70px var(--mat)}}
.tag{margin:10px 0 26px;color:var(--dim);font-size:clamp(13px,3.6vw,16px);line-height:1.8}
.tag span:nth-child(1){color:var(--bio)}.tag span:nth-child(2){color:var(--phy)}.tag span:nth-child(3){color:var(--mat)}
.big{font-family:inherit;font-weight:800;font-size:18px;color:#04101a;border:none;padding:14px 38px;border-radius:40px;cursor:pointer;background:linear-gradient(135deg,var(--phy),var(--vio),var(--bio));background-size:200% 200%;animation:grad 4s ease infinite;box-shadow:0 0 28px rgba(139,92,246,.6)}
@keyframes grad{50%{background-position:100% 50%}}
/* menu */
#menu{justify-content:flex-start;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);overflow-y:auto}
#menu h2{margin:8px 0 2px;font-size:26px;font-weight:800;text-shadow:0 0 16px var(--phy)}
#menu p{margin:0 0 14px;color:var(--dim);font-size:13px}
.card{position:relative;width:min(100%,440px);margin:8px 0;padding:14px 16px;border-radius:22px;display:flex;align-items:center;gap:14px;cursor:pointer;overflow:hidden;background:rgba(255,255,255,.045);border:1.5px solid var(--c);animation:cg 3s ease-in-out infinite;backdrop-filter:blur(4px)}
.card::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{to{left:130%}}
@keyframes cg{50%{box-shadow:0 0 26px var(--c)}0%,100%{box-shadow:0 0 8px var(--c)}}
.card:active{transform:scale(.98)}
.card svg{width:72px;height:72px;flex:none;filter:drop-shadow(0 0 8px var(--c))}
.card h3{margin:0;font-size:21px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.card small{color:var(--dim);font-size:12.5px;line-height:1.6;display:block;margin-top:2px}
.card em{font-style:normal;font-size:12px;color:var(--c);font-weight:600}
.heart{transform-origin:12px 12px;animation:beat 1s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.sweep{transform-origin:36px 36px;animation:spin 3s linear infinite}
.tri{stroke-dasharray:200;animation:draw 3s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:200}55%,100%{stroke-dashoffset:0}}
/* voice */
.vbtn{position:fixed;top:calc(var(--sat) + 10px);left:12px;z-index:30;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--phy);background:rgba(5,28,70,.95);color:#fff;font-size:19px;cursor:pointer}
/* view */
#view{background:var(--bg);justify-content:flex-start}
.bar{width:100%;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 8px) 12px 8px;border-bottom:1px solid var(--c);background:rgba(5,28,70,.95);position:relative;z-index:5}
.bar h4{margin:0;flex:1;font-size:17px;font-weight:800;color:var(--c);text-shadow:0 0 10px var(--c)}
.back{font-family:inherit;font-weight:600;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--c);border-radius:20px;padding:6px 14px;cursor:pointer}
#view .vbtn{position:static;width:38px;height:38px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.askbtn{flex:none;height:38px;padding:0 14px;border-radius:20px;border:none;font-family:inherit;font-weight:800;font-size:13px;color:#04101a;background:linear-gradient(135deg,var(--phy),var(--vio));box-shadow:0 0 14px rgba(34,230,255,.55);cursor:pointer;white-space:nowrap}
.sheetWrap{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(2,3,8,.55);padding:0 10px calc(var(--sab) + 14px)}
.sheetWrap.open{display:flex}
.sheet{width:100%;max-width:420px;max-height:min(64vh,520px);overflow-y:auto;background:rgba(6,34,84,.98);border:1.5px solid var(--c);border-radius:22px;padding:12px 14px calc(var(--sab) + 12px);box-shadow:0 -6px 34px rgba(0,0,0,.55);transform:translateY(16px) scale(.98);opacity:0;transition:transform .28s ease,opacity .28s ease}
.sheetWrap.open .sheet{transform:none;opacity:1}
.sh{display:flex;align-items:center;justify-content:space-between;font-weight:800;color:var(--c)}
.sh button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font-family:inherit;font-size:12.5px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:18px;padding:6px 12px;cursor:pointer}
#ans{min-height:54px;max-height:34vh;overflow-y:auto;background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.85;margin-bottom:10px;white-space:pre-wrap}
.in{display:flex;gap:8px}
.in input{flex:1;font-family:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--c);border-radius:22px;padding:10px 14px;outline:none;min-width:0}
.in button{font-family:inherit;font-weight:800;border:none;border-radius:22px;padding:0 16px;color:#04101a;background:var(--c);cursor:pointer;font-size:15px}
#flash{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,var(--c),transparent 65%);pointer-events:none}
#flash.go{display:flex;animation:fl 1s ease forwards}
@keyframes fl{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
#flash span{font-size:60px;filter:drop-shadow(0 0 20px #fff)}
.card .ic{font-size:40px;width:72px;text-align:center;flex:none}.card h3{font-size:16px;line-height:1.5}.nb{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--c);color:#04101a;text-align:center;font-size:14px;margin-left:6px;text-shadow:none}#grid{display:flex;flex-direction:column;align-items:center;width:100%}.bar{gap:6px;padding-left:8px;padding-right:8px}.bar h4{display:none}.bar .back{flex:none;margin-inline-end:auto;padding:6px 12px}.bar .askbtn{flex:none;height:38px;padding:0 12px;font-size:15px}.bar .vbtn{position:static;flex:none;width:38px;height:38px;font-size:17px}</style>

-<\/div><div class=\"lbl\">المسافة (متر)<\/div><\/div>\n  <div class=\"card\"><div class=\"val\" id=\"tof\" style=\"color:var(--magenta)\">--<\/div><div class=\"lbl\">زمن الرجوع (نانوثانية)<\/div><\/div>\n<\/div>\n<div class=\"formula\">المسافة = سرعة الضوء × الزمن ÷ 2<\/div>\n<div class=\"decision\" id=\"decision\"><\/div>\n<div class=\"controls\">\n  <button id=\"modeBtn\">🎮 تحكم يدوي<\/button>\n  <button id=\"viewBtn\">🤖 شوف مثل الروبوت<\/button>\n  <button id=\"talkBtn\">🔊 اشرح<\/button>\n<\/div>\n<div class=\"hint\" id=\"speedRow\">السرعة 🐢 <input type=\"range\" id=\"spd\" min=\"0.15\" max=\"2.5\" step=\"0.05\" value=\"0.5\" style=\"vertical-align:middle;width:140px;accent-color:#22e6ff\"> 🐇<\/div>\n<p class=\"caption\" id=\"caption\"><\/p>\n<script>\nconst cv=document.getElementById('c'),ctx=cv.getContext('2d');\nconst W=10,dpr=Math.min(devicePixelRatio||1,2);let S=1;\nfunction resize(){const w=Math.min(innerWidth-24,460);cv.style.width=w+'px';cv.style.height=w+'px';cv.width=w*dpr;cv.height=w*dpr;S=cv.width/W;}\nresize();addEventListener('resize',resize);\nconst robot={x:5,y:5},HEAD=-Math.PI/2;\nconst objs=[{t:'c',x:7.2,y:2.6,r:.6},{t:'c',x:2.6,y:3.2,r:.5},{t:'b',x:3,y:7.4,w:1.7,h:1.1},{t:'c',x:7.5,y:7.2,r:.45}];\nfunction segs(){const s=[],m=.1,L=W-m;\n [[m,m,L,m],[L,m,L,L],[L,L,m,L],[m,L,m,m]].forEach(a=>s.push(a));\n objs.forEach(o=>{if(o.t==='b'){const x1=o.x-o.w/2,x2=o.x+o.w/2,y1=o.y-o.h/2,y2=o.y+o.h/2;\n  s.push([x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]);}});return s;}\nfunction cast(a){const dx=Math.cos(a),dy=Math.sin(a);let best=Infinity;\n objs.forEach(o=>{if(o.t!=='c')return;const fx=robot.x-o.x,fy=robot.y-o.y,b=fx*dx+fy*dy,c=fx*fx+fy*fy-o.r*o.r,d=b*b-c;\n  if(d>=0){const t=-b-Math.sqrt(d);if(t>0&&t<best)best=t;}});\n segs().forEach(([px,py,qx,qy])=>{const sx=qx-px,sy=qy-py,den=dx*sy-dy*sx;if(Math.abs(den)<1e-9)return;\n  const ox=px-robot.x,oy=py-robot.y,t=(ox*sy-oy*sx)/den,u=(ox*dy-oy*dx)/den;\n  if(t>0&&u>=0&&u<=1&&t<best)best=t;});\n return best;}\nlet pts=[],ang=0,lastD=0,robotView=false,manual=false,target=-Math.PI/2,speed=.5,hudT=0;\nconst distEl=document.getElementById('dist'),tofEl=document.getElementById('tof'),decEl=document.getElementById('decision');\nfunction norm(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}\nlet last=performance.now();\nfunction frame(now){\n requestAnimationFrame(frame);\n const dt=Math.min((now-last)/1000,.05);last=now;\n let step;if(manual){const da=norm(target-ang);step=Math.max(-7*dt,Math.min(7*dt,da));}else step=speed*dt;\n const n=Math.max(1,Math.ceil(Math.abs(step)/.02));\n for(let i=1;i<=n;i++){const a=ang+step*i/n,d=cast(a);pts.push({a,d,t:now});lastD=d;}\n ang+=step;\n pts=pts.filter(p=>now-p.t<1900);\n draw(now);\n // hud\n if(now-hudT>180){hudT=now;distEl.textContent=isFinite(lastD)?lastD.toFixed(1):'--';tofEl.textContent=isFinite(lastD)?(2*lastD/3e8*1e9).toFixed(1):'--';}\n let m=Infinity;pts.forEach(p=>{if(Math.abs(norm(p.a-HEAD))<.6&&p.d<m)m=p.d;});\n if(m<2){decEl.textContent='⚠️ عائق أمامي! الروبوت يقرر: انعطف';decEl.style.color='var(--magenta)';}\n else{decEl.textContent='✅ الطريق مفتوح: الروبوت يتقدم';decEl.style.color='var(--lime)';}\n}\nfunction P(x){return x*S;}\nfunction draw(now){\n ctx.clearRect(0,0,cv.width,cv.height);\n ctx.strokeStyle='rgba(34,230,255,.12)';ctx.lineWidth=1;ctx.fillStyle='rgba(125,146,179,.6)';ctx.font=(10*dpr)+'px Cairo';\n for(let r=1;r<=4;r++){ctx.beginPath();ctx.arc(P(robot.x),P(robot.y),P(r),0,7);ctx.stroke();ctx.fillText(r+'م',P(robot.x+r)+3,P(robot.y)-3);}\n if(!robotView){\n  ctx.lineWidth=2*dpr;ctx.strokeStyle='rgba(139,92,246,.7)';ctx.shadowColor='#8b5cf6';ctx.shadowBlur=8*dpr;\n  ctx.strokeRect(P(.1),P(.1),P(W-.2),P(W-.2));\n  objs.forEach(o=>{ctx.beginPath();if(o.t==='c')ctx.arc(P(o.x),P(o.y),P(o.r),0,7);else ctx.rect(P(o.x-o.w/2),P(o.y-o.h/2),P(o.w),P(o.h));\n   ctx.fillStyle='rgba(139,92,246,.12)';ctx.fill();ctx.stroke();});\n  ctx.shadowBlur=0;\n }\n // point cloud\n pts.forEach(p=>{if(!isFinite(p.d))return;const age=(performance.now()-p.t)/1900,hue=190+Math.min(p.d/8,1)*90;\n  ctx.fillStyle='hsla('+hue+',100%,65%,'+(1-age)+')';ctx.beginPath();\n  ctx.arc(P(robot.x+Math.cos(p.a)*p.d),P(robot.y+Math.sin(p.a)*p.d),(2+ (1-age)*1.5)*dpr,0,7);ctx.fill();});\n // beam\n const d=isFinite(lastD)?lastD:14,ex=P(robot.x+Math.cos(ang)*d),ey=P(robot.y+Math.sin(ang)*d);\n ctx.strokeStyle='#ff2e7e';ctx.lineWidth=2.2*dpr;ctx.shadowColor='#ff2e7e';ctx.shadowBlur=14*dpr;\n ctx.beginPath();ctx.moveTo(P(robot.x),P(robot.y));ctx.lineTo(ex,ey);ctx.stroke();\n ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,4*dpr,0,7);ctx.fill();ctx.shadowBlur=0;\n // robot\n ctx.shadowColor='#22e6ff';ctx.shadowBlur=16*dpr;ctx.fillStyle='#22e6ff';ctx.beginPath();ctx.arc(P(robot.x),P(robot.y),P(.22),0,7);ctx.fill();\n ctx.beginPath();ctx.moveTo(P(robot.x),P(robot.y-.42));ctx.lineTo(P(robot.x-.14),P(robot.y-.2));ctx.lineTo(P(robot.x+.14),P(robot.y-.2));ctx.fill();ctx.shadowBlur=0;\n}\nrequestAnimationFrame(frame);\n// drag\nlet drag=null;\nfunction pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*W};}\ncv.addEventListener('pointerdown',e=>{const p=pos(e);let best=null,bd=1.1;objs.forEach(o=>{const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;best=o;}});drag=best;if(drag||manual)cv.setPointerCapture(e.pointerId);if(!drag&&manual){aiming=true;aim(p);}});\ncv.addEventListener('pointermove',e=>{if(aiming){aim(pos(e));return;}if(!drag)return;const p=pos(e);drag.x=Math.min(8.8,Math.max(1.2,p.x));drag.y=Math.min(8.8,Math.max(1.2,p.y));});\nlet aiming=false;function aim(p){target=Math.atan2(p.y-robot.y,p.x-robot.x);}\ncv.addEventListener('pointerup',()=>{drag=null;aiming=false;});cv.addEventListener('pointercancel',()=>{drag=null;aiming=false;});\nconst modeBtn=document.getElementById('modeBtn'),speedRow=document.getElementById('speedRow');\nmodeBtn.onclick=()=>{manual=!manual;modeBtn.classList.toggle('active',manual);modeBtn.textContent=manual?'🔄 تلقائي':'🎮 تحكم يدوي';speedRow.style.display=manual?'none':'block';if(manual)target=ang;document.querySelector('.hint').textContent=manual?'المس أي مكان لتوجيه الليزر نحوه، أو اسحب العوائق':'اسحب العوائق بإصبعك وشاهد الروبوت كيف يفكر';};\ndocument.getElementById('spd').oninput=e=>speed=+e.target.value;\ndocument.getElementById('viewBtn').onclick=function(){robotView=!robotView;this.classList.toggle('active',robotView);this.textContent=robotView?'👁 أظهر الغرفة':'🤖 شوف مثل الروبوت';};\nconst text=\"الليزر شعاع ضوء دقيق. الروبوت يرسله ويقيس الزمن الذي يحتاجه ليرجع بعد أن يرتطم بجسم. وبما أن سرعة الضوء معروفة، يحسب المسافة بدقة. ومئات القياسات في الثانية ترسم للروبوت خريطة من النقاط، وبها يقرر بذكائه أين يمشي وأين يتجنب العوائق. هكذا تعمل السيارات الذاتية.\";\nconst cap=document.getElementById('caption'),talk=document.getElementById('talkBtn');\nlet voices=[];function lv(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];}\nif('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}\ntalk.onclick=()=>{cap.textContent=text;if(!('speechSynthesis' in window))return;\n try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.95;const v=voices.find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;\n u.onstart=()=>talk.classList.add('active');u.onend=()=>talk.classList.remove('active');speechSynthesis.speak(u);}catch(e){}};\n<\/script>\n<\/body>\n<\/html>\n"}</script>
